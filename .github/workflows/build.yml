name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Configurar Icone Oficial GBA PLAY
      run: |
        curl -sL "https://harmonious-parfait-a4975b.netlify.app/logo.png" -o logo.png
        rm -rf app/src/main/res/mipmap*
        for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p app/src/main/res/$d
          cp logo.png app/src/main/res/$d/ic_launcher.png
          cp logo.png app/src/main/res/$d/ic_launcher_round.png
        done

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GbaPlay-APK
        path: app/build/outputs/apk/debug/app-debug.apk
